# Прод: готовые образы из GitHub Container Registry (собираются в .github/workflows/docker.yml).
#   docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d
# Нужен .env рядом — скопируйте .env.prod.example (POSTGRES_PASSWORD, APP_SECRET_KEY, FRONTEND_URL, redirect URI и ключи).
# HTTPS: сертификат Let's Encrypt для DOMAIN из /etc/letsencrypt хоста; порт 80 перенаправляет на 443 (см. README).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: assistant
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      retries: 10
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/crepythecreator/voices-assistant}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/crepythecreator/voices-assistant}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
